<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>My Travel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#111}
    body{overflow:hidden}
    header{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:1000}
    h1{font-size:19px;margin:0}.topbtn{border:0;background:#eee;border-radius:10px;padding:8px 10px;font-size:13px}
    #map{height:calc(100vh - 58px);height:calc(100dvh - 58px);width:100%;position:relative}
    .panel{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0002;z-index:1100;max-height:70vh;overflow:auto;display:none}
    .panel.show{display:block}.panel h2{font-size:18px;margin:0 0 10px}.row{display:flex;gap:8px}.row>*{flex:1}
    input,textarea,button{font:inherit} input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:5px 0 9px;background:#fff}
    textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 12px;background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.btn.danger{background:#c62828}
    .thumbs{display:flex;gap:8px;overflow:auto;margin:5px 0 10px}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:pointer}
    #detailPhotos{display:flex;flex-direction:column;gap:10px;overflow:visible}
    #detailPhotos img.detail-photo{width:auto;height:auto;max-width:100%;max-height:55vh;object-fit:contain;border-radius:12px;display:block;margin:0 auto;cursor:zoom-in}
    .photo-modal{position:fixed;inset:0;background:#000d;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;touch-action:none}
    .photo-modal.show{display:flex}
    .photo-modal img{max-width:96vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:8px;user-select:none;-webkit-user-drag:none}
    .photo-modal .close-photo{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;border:0;background:#fff;color:#111;width:42px;height:42px;border-radius:50%;font-size:24px;line-height:42px;z-index:2}
    .photo-modal .photo-counter{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;background:#0008;padding:6px 10px;border-radius:20px;font-size:13px}
    .route-mode{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:#111;color:#fff;padding:9px 14px;border-radius:20px;display:none;white-space:nowrap}
    .route-mode.show{display:block}.small{font-size:12px;color:#666}.maplibregl-ctrl-attrib{font-size:10px}
    .travel-marker{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#111;border:3px solid #fff;box-shadow:0 2px 8px #0005;cursor:pointer}
    .travel-marker::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:7px;top:7px}
    .maplibregl-marker{z-index:5}
  </style>
</head>
<body>
<header><h1>🗺️ My Travel Map</h1><button class="topbtn" id="settingsBtn">設定</button></header>
<div id="map"></div>
<div id="routeMode" class="route-mode">ルート作成中：地図を順番にタップ　「完了」で保存</div>

<div id="placePanel" class="panel">
  <h2>📍 場所を登録</h2>
  <div class="small" id="coords"></div>
  <input id="placeName" placeholder="場所の名前（例：清水寺）">
  <input id="placeDate" type="date">
  <textarea id="placeNote" placeholder="思い出・メモ"></textarea>
  <input id="placePhotos" type="file" accept="image/*" multiple>
  <div class="thumbs" id="photoPreview"></div>
  <div class="row"><button class="btn secondary" id="cancelPlace">キャンセル</button><button class="btn" id="savePlace">保存</button></div>
</div>

<div id="detailPanel" class="panel">
  <h2 id="detailName"></h2><div class="small" id="detailDate"></div>
  <div id="detailPhotos"></div><p id="detailNote"></p>
  <div class="row"><button class="btn secondary" id="closeDetail">閉じる</button><button class="btn danger" id="deletePlace">削除</button></div>
</div>

<div id="routePanel" class="panel">
  <h2>🛣️ ルートを保存</h2>
  <input id="routeName" placeholder="ルート名（例：京都旅行）">
  <div class="small" id="routeCount">0地点</div>
  <div class="row"><button class="btn secondary" id="cancelRoute">キャンセル</button><button class="btn" id="saveRoute">完了・保存</button></div>
</div>

<div id="photoModal" class="photo-modal" role="dialog" aria-label="写真を拡大表示" aria-modal="true">
  <button class="close-photo" id="closePhotoModal" aria-label="閉じる">×</button>
  <img id="modalPhoto" alt="拡大写真">
  <div class="photo-counter" id="photoCounter"></div>
</div>

<div id="settingsPanel" class="panel">
  <h2>⚙️ データ管理</h2>
  <p class="small">旅の場所・ルート・写真はこのiPhoneのIndexedDBに保存されます。地図はオンラインで必要な範囲だけ表示します。バックアップは定期的に行ってください。</p>
  <div class="row"><button class="btn" id="exportBtn">バックアップ</button><button class="btn secondary" id="importBtn">復元</button></div>
  <input id="importFile" type="file" accept=".json" style="display:none">
  <button class="btn secondary" id="closeSettings" style="width:100%;margin-top:8px">閉じる</button>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs';

const DB_NAME="MyTravelMapDB", DB_VERSION=1;
let db, map, pendingLngLat=null, selectedPlaceId=null, pendingPhotos=[], routeMode=false, routePoints=[], routeLineReady=false;
let markers=[], modalPhotoUrls=[], modalPhotos=[];

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("places")) d.createObjectStore("places",{keyPath:"id"});
      if(!d.objectStoreNames.contains("routes")) d.createObjectStore("routes",{keyPath:"id"});
    };
    req.onsuccess=e=>{db=e.target.result;resolve()};
    req.onerror=e=>reject(e);
  });
}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function put(store,obj){return new Promise((res,rej)=>{const r=tx(store,"readwrite").put(obj);r.onsuccess=()=>res();r.onerror=rej})}
function get(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function all(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})}
function del(store,id){return new Promise((res,rej)=>{const r=tx(store,"readwrite").delete(id);r.onsuccess=()=>res();r.onerror=rej})}
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function show(id){closePanels();document.getElementById(id).classList.add('show')}

function initMap(){
  map=new maplibregl.Map({
    container:'map',
    style:'https://tiles.openfreemap.org/styles/liberty',
    center:[135.7681,35.0116],
    zoom:13,
    attributionControl:true,
    cooperativeGestures:false
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'top-right');
  map.on('load', async ()=>{
    map.addSource('travel-routes',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'travel-routes-line',type:'line',source:'travel-routes',paint:{'line-color':'#111','line-width':4,'line-opacity':0.85}});
    await renderPlaces();
  });
  map.on('click',e=>{
    if(routeMode){
      routePoints.push([e.lngLat.lng,e.lngLat.lat]);
      updateRoutePreview();
      document.getElementById('routeCount').textContent=routePoints.length+'地点';
      return;
    }
    pendingLngLat={lng:e.lngLat.lng,lat:e.lngLat.lat};
    document.getElementById('coords').textContent=`緯度 ${e.lngLat.lat.toFixed(5)} / 経度 ${e.lngLat.lng.toFixed(5)}`;
    document.getElementById('placeDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('placeName').value='';document.getElementById('placeNote').value='';
    pendingPhotos=[];document.getElementById('photoPreview').innerHTML='';document.getElementById('placePhotos').value='';
    show('placePanel');
  });
}

function routeGeoJSON(routes, preview){
  const features=routes.map(r=>({type:'Feature',geometry:{type:'LineString',coordinates:r.points},properties:{name:r.name||''}}));
  if(preview&&preview.length>=2) features.push({type:'Feature',geometry:{type:'LineString',coordinates:preview},properties:{name:'preview'}});
  return {type:'FeatureCollection',features};
}
async function updateRoutePreview(){
  if(!map.getSource('travel-routes')) return;
  const routes=await all('routes');
  map.getSource('travel-routes').setData(routeGeoJSON(routes,routePoints));
}
async function renderRoutes(){
  if(!map.getSource('travel-routes')) return;
  const routes=await all('routes');
  map.getSource('travel-routes').setData(routeGeoJSON(routes,null));
}

function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}
async function renderPlaces(){
  clearMarkers();
  const places=await all('places');
  places.forEach(p=>{
    const el=document.createElement('div');el.className='travel-marker';el.setAttribute('aria-label',p.name||'登録場所');
    el.addEventListener('click',e=>{e.stopPropagation();showDetail(p.id)});
    const m=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map);
    markers.push(m);
  });
  await renderRoutes();
}

async function showDetail(id){
  const p=await get('places',id);if(!p)return;
  selectedPlaceId=id;
  document.getElementById('detailName').textContent='📍 '+(p.name||'無題');
  document.getElementById('detailDate').textContent=p.date||'';
  document.getElementById('detailNote').textContent=p.note||'';
  const box=document.getElementById('detailPhotos');box.innerHTML='';
  (p.photos||[]).forEach((blob,index)=>{
    const img=document.createElement('img');img.className='detail-photo';img.src=URL.createObjectURL(blob);img.alt=`写真 ${index+1}`;
    img.addEventListener('click',()=>openPhotoModal(p.photos,index));box.appendChild(img);
  });
  show('detailPanel');
}

function openPhotoModal(photos,index){
  modalPhotos=photos||[];
  modalPhotoUrls.forEach(u=>URL.revokeObjectURL(u));
  modalPhotoUrls=modalPhotos.map(b=>URL.createObjectURL(b));
  const modal=document.getElementById('photoModal');
  modal.dataset.index=String(index);
  updateModalPhoto();
  modal.classList.add('show');
}
function updateModalPhoto(){
  const modal=document.getElementById('photoModal');const i=Number(modal.dataset.index||0);
  if(!modalPhotoUrls[i])return;
  document.getElementById('modalPhoto').src=modalPhotoUrls[i];
  document.getElementById('photoCounter').textContent=`${i+1} / ${modalPhotoUrls.length}`;
}
function closePhotoModal(){
  document.getElementById('photoModal').classList.remove('show');
  modalPhotoUrls.forEach(u=>URL.revokeObjectURL(u));modalPhotoUrls=[];modalPhotos=[];
}
function changeModalPhoto(delta){
  if(!modalPhotoUrls.length)return;
  const modal=document.getElementById('photoModal');let i=Number(modal.dataset.index||0)+delta;
  if(i<0)i=modalPhotoUrls.length-1;if(i>=modalPhotoUrls.length)i=0;modal.dataset.index=String(i);updateModalPhoto();
}

document.getElementById('closePhotoModal').onclick=closePhotoModal;
document.getElementById('photoModal').onclick=e=>{if(e.target.id==='photoModal')closePhotoModal()};
document.getElementById('modalPhoto').onclick=e=>e.stopPropagation();
let touchStartX=0,touchStartY=0;
document.getElementById('photoModal').addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
document.getElementById('photoModal').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;const dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))changeModalPhoto(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(!document.getElementById('photoModal').classList.contains('show'))return;if(e.key==='Escape')closePhotoModal();if(e.key==='ArrowRight')changeModalPhoto(1);if(e.key==='ArrowLeft')changeModalPhoto(-1)});

document.getElementById('placePhotos').onchange=e=>{
  pendingPhotos=[...e.target.files];const box=document.getElementById('photoPreview');box.innerHTML='';
  pendingPhotos.forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);box.appendChild(img)});
};
document.getElementById('savePlace').onclick=async()=>{
  if(!pendingLngLat)return;
  await put('places',{id:crypto.randomUUID(),lat:pendingLngLat.lat,lng:pendingLngLat.lng,name:document.getElementById('placeName').value.trim(),date:document.getElementById('placeDate').value,note:document.getElementById('placeNote').value,photos:pendingPhotos});
  closePanels();pendingLngLat=null;await renderPlaces();
};
document.getElementById('cancelPlace').onclick=closePanels;
document.getElementById('closeDetail').onclick=closePanels;
document.getElementById('deletePlace').onclick=async()=>{if(selectedPlaceId&&confirm('この場所を削除しますか？')){await del('places',selectedPlaceId);closePanels();await renderPlaces()}};

document.getElementById('settingsBtn').onclick=()=>show('settingsPanel');
document.getElementById('closeSettings').onclick=closePanels;

document.getElementById('cancelRoute').onclick=()=>{
  routeMode=false;routePoints=[];document.getElementById('routeMode').classList.remove('show');closePanels();renderRoutes();
};
document.getElementById('saveRoute').onclick=async()=>{
  if(routePoints.length<2){alert('2地点以上タップしてください');return}
  await put('routes',{id:crypto.randomUUID(),name:document.getElementById('routeName').value.trim()||'無題のルート',points:routePoints});
  routeMode=false;routePoints=[];document.getElementById('routeMode').classList.remove('show');closePanels();await renderRoutes();
};

document.getElementById('exportBtn').onclick=async()=>{
  const places=await all('places'),routes=await all('routes');
  const photoToData=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
  const out={version:2,createdAt:new Date().toISOString(),places:[],routes};
  for(const p of places){const q={...p,photos:[]};for(const b of (p.photos||[]))q.photos.push(await photoToData(b));out.places.push(q)}
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MyTravelMap_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());if(!data.version)throw Error('invalid');
    for(const r of (data.routes||[]))await put('routes',r);
    for(const p of (data.places||[])){
      const photos=[];for(const s of (p.photos||[])){const res=await fetch(s);photos.push(await res.blob())}
      await put('places',{...p,photos});
    }
    alert('復元しました');location.reload();
  }catch(err){alert('バックアップファイルを読み込めませんでした')}
  e.target.value='';
};

// 「ルート作成」ボタンは設定画面から将来追加予定。現段階では画面長押し等を避け、APIを公開しない。
// 開発用に、設定ボタンを長押しするとルート作成を開始できるようにしている。
let pressTimer=null;
const settingsBtn=document.getElementById('settingsBtn');
settingsBtn.addEventListener('pointerdown',()=>{pressTimer=setTimeout(()=>{closePanels();routeMode=true;routePoints=[];document.getElementById('routeName').value='';document.getElementById('routeCount').textContent='0地点';document.getElementById('routeMode').classList.add('show');show('routePanel')},700)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>settingsBtn.addEventListener(ev,()=>{clearTimeout(pressTimer)}));

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
await openDB();
initMap();
</script>
</body>
</html>
