<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff">
<title>My Travel Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#222}
#map{position:fixed;inset:0}.toolbar{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 13px;background:#fff;box-shadow:0 2px 10px #0003;font-size:14px;font-weight:700}button.primary{background:#1769e0;color:#fff}.danger{background:#fff1f1;color:#b42318}
.panel{display:none;position:fixed;z-index:30;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 18px #0003;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.panel.show{display:block}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.title{margin:0;font-size:20px}.space{height:8px}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fafafa}textarea{min-height:90px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.muted{font-size:12px;color:#666}.item{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid #eee;border-radius:12px;margin:7px 0}.item .grow{flex:1}.drag-handle{font-size:22px;color:#777}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}.legend span{display:flex;align-items:center;gap:5px}.sw{width:18px;height:4px;border-radius:4px;display:inline-block}
.viewer{display:none;position:fixed;z-index:100;inset:0;background:#000e;align-items:center;justify-content:center}.viewer.show{display:flex}.viewer img{max-width:96vw;max-height:90vh}.viewer button{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top))}
#pinCrosshair{display:none;position:fixed;z-index:18;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none}#pinCrosshair.show{display:block}
#pinCrosshair:before,#pinCrosshair:after{content:"";position:absolute;left:50%;top:50%;background:#666;border-radius:2px;transform:translate(-50%,-50%)}#pinCrosshair:before{width:30px;height:2px}#pinCrosshair:after{height:30px;width:2px}#pinCrosshair .dot{position:absolute;left:50%;top:50%;width:7px;height:7px;border:2px solid #666;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.route-draw-banner{display:none;position:fixed;z-index:40;top:calc(78px + env(safe-area-inset-top));left:8px;right:8px;transform:none;background:#000d;color:#fff;border-radius:14px;padding:7px;white-space:normal;font-size:12px;text-align:center}.route-draw-banner button{padding:7px 9px;margin:4px 2px 0;box-shadow:none;touch-action:manipulation}.route-draw-banner.show{display:block}
#drawCanvas{position:fixed;inset:0;z-index:15;display:none;touch-action:auto}#drawCanvas.show{display:block}.route-current{padding:9px;border-radius:10px;background:#f6f7f9;margin:8px 0}
.toolbar.route-adding #routeBtn{display:none}.empty{padding:18px;text-align:center;color:#777;background:#f7f7f8;border-radius:12px}
</style>
</head>
<body>
<div id="map"></div><div id="pinCrosshair"><span class="dot"></span></div><canvas id="drawCanvas"></canvas>
<div class="toolbar"><button id="addPinBtn">＋ ピンを追加</button><button id="routeBtn" class="primary">🛣️ 旅行のルートを作成</button><button id="viewRouteBtn">🗺️ 旅行ルートを参照</button></div>
<div id="drawBanner" class="route-draw-banner"><span id="drawText"></span><button id="drawToggleBtn">⏸ 描画OFF</button><button id="undoPointBtn">↩ 一つ戻す</button><button id="finishDrawBtn">完了</button><button id="cancelDrawBtn" class="danger">取消</button></div>

<div id="pinPanel" class="panel"><div class="row"><h2 class="title" id="pinTitle">ピンを追加</h2><button id="closePin">閉じる</button></div>
<div id="placement"><div id="placementNote" class="route-current">地図中央の十字が位置です。地図を動かして位置を合わせ、「この位置に決定」を押してください。</div><div class="row"><button id="cancelPlacement">キャンセル</button><button id="confirmPlacement" class="primary">この位置に決定</button></div></div>
<div id="editor" style="display:none"><div class="route-current">位置が決まりました。名前・メモ・写真を入力してください。</div>
<label>場所の名前</label><div class="space"></div><input id="pinName" placeholder="例：清水寺"><div class="space"></div><label>メモ</label><div class="space"></div><textarea id="pinMemo"></textarea><div class="space"></div><label>訪問日</label><div class="space"></div><input id="pinDate" type="date"><div class="space"></div><label>写真</label><div class="space"></div><div id="pinPhotos" class="photos"></div><div class="space"></div><input id="photoInput" type="file" accept="image/*" multiple><div class="space"></div><div class="row"><button id="cancelPin">キャンセル</button><button id="savePin" class="primary">保存</button></div></div></div>

<div id="detailPanel" class="panel"><div class="row"><h2 class="title" id="detailTitle"></h2><button id="closeDetail">閉じる</button></div><div id="detailBody"></div><div class="row"><button id="editPin" class="primary">✏️ 編集</button><button id="deletePin" class="danger">削除</button></div></div>

<div id="routePanel" class="panel"><div class="row"><h2 class="title">旅行のルートを作成</h2><button id="closeRoute">閉じる</button></div><div class="space"></div><label>旅行の名前</label><div class="space"></div><input id="routeName" placeholder="例：2026年 京都旅行"><div id="routeCurrent" class="route-current">「＋追加」からピンまたは道筋を追加してください。</div><div class="row"><button id="addRoute" class="primary">＋ 追加</button><button id="undoItem">↩ 一つ戻す</button><button id="saveRoute" class="primary">保存</button></div><div id="routeItems"></div><b>交通手段</b><div class="legend"><span><i class="sw" style="background:#16a34a"></i>徒歩</span><span><i class="sw" style="background:#2563eb"></i>バス</span><span><i class="sw" style="background:#dc2626"></i>電車</span><span><i class="sw" style="background:#f59e0b"></i>車</span></div></div>

<div id="choicePanel" class="panel"><div class="row"><h2 class="title">追加</h2><button id="closeChoice">閉じる</button></div><div class="space"></div><button id="choosePin" style="width:100%">📍 ピンを追加</button><div class="space"></div><button id="choosePath" style="width:100%">✏️ 道筋を描く</button></div>
<div id="routesPanel" class="panel"><div class="row"><h2 class="title">旅行ルートを参照</h2><button id="closeRoutes">閉じる</button></div><div id="routesList"></div></div>
<div id="routeView" class="panel"><div class="row"><h2 class="title" id="routeViewTitle"></h2><button id="closeRouteView">閉じる</button></div><div id="routeViewBody"></div></div>
<div id="viewer" class="viewer"><button id="closeViewer">閉じる</button><img id="viewerImg"></div>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
(()=>{'use strict';
const MODE={walk:{label:'徒歩',icon:'🚶',color:'#16a34a'},bus:{label:'バス',icon:'🚌',color:'#2563eb'},train:{label:'電車',icon:'🚃',color:'#dc2626'},car:{label:'車',icon:'🚗',color:'#f59e0b'}};
let db,map,pins=[],routes=[],selected=null,editing=null,currentRoute=null,routeMode=false,adding=false,pinPlacement=false,placementCoord=null,pendingRoutePin=false,drawing=false,drawPoints=[],drawStrokes=[];
const $=id=>document.getElementById(id),E={addPin:$('addPinBtn'),route:$('routeBtn'),view:$('viewRouteBtn'),pin:$('pinPanel'),placement:$('placement'),editor:$('editor'),confirm:$('confirmPlacement'),cancelPlacement:$('cancelPlacement'),savePin:$('savePin'),cancelPin:$('cancelPin'),closePin:$('closePin'),pinTitle:$('pinTitle'),name:$('pinName'),memo:$('pinMemo'),date:$('pinDate'),photos:$('pinPhotos'),photo:$('photoInput'),detail:$('detailPanel'),detailTitle:$('detailTitle'),detailBody:$('detailBody'),edit:$('editPin'),del:$('deletePin'),closeDetail:$('closeDetail'),routePanel:$('routePanel'),closeRoute:$('closeRoute'),routeName:$('routeName'),routeCurrent:$('routeCurrent'),addRoute:$('addRoute'),undoItem:$('undoItem'),saveRoute:$('saveRoute'),items:$('routeItems'),choice:$('choicePanel'),closeChoice:$('closeChoice'),choosePin:$('choosePin'),choosePath:$('choosePath'),routes:$('routesPanel'),closeRoutes:$('closeRoutes'),list:$('routesList'),viewPanel:$('routeView'),viewTitle:$('routeViewTitle'),viewBody:$('routeViewBody'),closeView:$('closeRouteView'),cross:$('pinCrosshair'),canvas:$('drawCanvas'),banner:$('drawBanner'),drawText:$('drawText'),drawToggle:$('drawToggleBtn'),undoPoint:$('undoPointBtn'),finishDraw:$('finishDrawBtn'),cancelDraw:$('cancelDrawBtn'),viewer:$('viewer'),viewerImg:$('viewerImg'),closeViewer:$('closeViewer')};
const uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('MyTravelMapDB',3);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('pins'))d.createObjectStore('pins',{keyPath:'id'});if(!d.objectStoreNames.contains('routes'))d.createObjectStore('routes',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(s){return new Promise((res,rej)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(s,o){return new Promise((res,rej)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function remove(s,id){return new Promise((res,rej)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function dataURL(f){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function marker(p){if(p.marker)p.marker.remove();let el=document.createElement('div');el.style.cssText='width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#d1242f;border:3px solid #fff;box-shadow:0 2px 8px #0005';el.innerHTML='<span style="display:block;transform:rotate(45deg);text-align:center;line-height:24px;color:#fff">•</span>';el.onclick=e=>{e.stopPropagation();detail(p.id)};p.marker=new maplibregl.Marker({element:el}).setLngLat(p.coord).addTo(map)}
function renderPins(){pins.forEach(marker)}
function addRouteLayer(){if(map.getSource('routeLines'))return;map.addSource('routeLines',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'routeLines',type:'line',source:'routeLines',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':5}})}
function renderLines(){if(!map?.getSource('routeLines'))return;let fs=[];[...routes,...(currentRoute?[currentRoute]:[])].forEach(r=>(r.items||[]).forEach(i=>{if(i.type==='path'&&i.points?.length>1)fs.push({type:'Feature',properties:{color:MODE[i.mode]?.color||'#666'},geometry:{type:'LineString',coordinates:i.points}})}));map.getSource('routeLines').setData({type:'FeatureCollection',features:fs})}
function showCross(show){pinPlacement=show;E.cross.classList.toggle('show',show)}
function beginPlacement(c,isRoute){pendingRoutePin=isRoute;placementCoord=(c||map.getCenter().toArray()).slice();showCross(true)}
function finishPlacement(){showCross(false);placementCoord=null;pendingRoutePin=false}
function openEditor(id,c,isRoute=false){editing=id||null;let p=id?pins.find(x=>x.id===id):null;E.pinTitle.textContent=id?'ピンを編集':(isRoute?'旅行ルートのピンを追加':'ピンを追加');E.name.value=p?.name||'';E.memo.value=p?.memo||'';E.date.value=p?.date||'';E.photo.value='';E.photos.innerHTML=(p?.photos||[]).map(s=>`<img src="${s}">`).join('');E.photos.querySelectorAll('img').forEach(x=>x.onclick=()=>openViewer(x.src));if(!id){beginPlacement(c||map.getCenter().toArray(),isRoute);E.placement.style.display='block';E.editor.style.display='none'}else{showCross(false);E.placement.style.display='none';E.editor.style.display='block'}closePanels();E.pin.classList.add('show')}
function detail(id){let p=pins.find(x=>x.id===id);if(!p)return;selected=id;E.detailTitle.textContent='📍 '+p.name;E.detailBody.innerHTML=`<div class="muted">${esc(p.date)}</div><p>${esc(p.memo||'')}</p><div class="photos">${(p.photos||[]).map(s=>`<img src="${s}">`).join('')}</div>`;E.detailBody.querySelectorAll('img').forEach(x=>x.onclick=()=>openViewer(x.src));closePanels();E.detail.classList.add('show')}
function openViewer(s){E.viewerImg.src=s;E.viewer.classList.add('show')}
E.viewerImg.onclick=()=>{};
E.closeViewer.onclick=()=>E.viewer.classList.remove('show');
E.addPin.onclick=()=>openEditor(null,map.getCenter().toArray(),false);
E.confirm.onclick=()=>{if(!placementCoord)placementCoord=map.getCenter().toArray();showCross(false);E.placement.style.display='none';E.editor.style.display='block'};
function cancelPinFlow(){finishPlacement();closePanels();if(adding){adding=false;E.route.classList.remove('route-adding');if(currentRoute)E.routePanel.classList.add('show')}}
E.cancelPlacement.onclick=cancelPinFlow;E.cancelPin.onclick=cancelPinFlow;E.closePin.onclick=cancelPinFlow;
E.savePin.onclick=async()=>{let p=editing?pins.find(x=>x.id===editing):null,wasRoute=!p&&pendingRoutePin&&currentRoute;if(!p){p={id:uid(),coord:placementCoord||map.getCenter().toArray(),photos:[]};pins.push(p)}p.name=E.name.value.trim()||'名称未設定';p.memo=E.memo.value;p.date=E.date.value;for(let f of E.photo.files)p.photos.push(await dataURL(f));await put('pins',p);marker(p);if(wasRoute){currentRoute.items.push({id:uid(),type:'pin',pinId:p.id});renderItems();E.routeCurrent.textContent=`📍 ${p.name} を行程に追加しました。`}finishPlacement();closePanels();editing=null;if(adding){adding=false;E.route.classList.remove('route-adding');if(currentRoute)E.routePanel.classList.add('show')}};
E.closeDetail.onclick=closePanels;E.edit.onclick=()=>{let id=selected;closePanels();openEditor(id)};E.del.onclick=async()=>{if(!selected)return;if(confirm('このピンを削除しますか？')){let p=pins.find(x=>x.id===selected);p?.marker?.remove();await remove('pins',selected);pins=pins.filter(x=>x.id!==selected);closePanels()}};

function enterRoute(){currentRoute={id:uid(),name:'',items:[]};routeMode=true;E.routeName.value='';renderItems();closePanels();E.routePanel.classList.add('show');renderLines()}
function exitRoute(){stopDrawing();routeMode=false;currentRoute=null;adding=false;E.route.classList.remove('route-adding');finishPlacement();closePanels();renderLines()}
E.route.onclick=enterRoute;E.closeRoute.onclick=exitRoute;
E.addRoute.onclick=()=>{if(!routeMode)return;adding=true;E.route.classList.add('route-adding');E.routePanel.classList.remove('show');E.choice.classList.add('show')};
E.closeChoice.onclick=()=>{E.choice.classList.remove('show');if(adding){adding=false;E.route.classList.remove('route-adding');E.routePanel.classList.add('show')}};
E.choosePin.onclick=()=>{E.choice.classList.remove('show');openEditor(null,map.getCenter().toArray(),true)};
E.choosePath.onclick=()=>{E.choice.classList.remove('show');chooseMode()};
function chooseMode(){let a=prompt('交通手段を選択してください。\\n1 = 徒歩\\n2 = バス\\n3 = 電車\\n4 = 車','1');let m={1:'walk',2:'bus',3:'train',4:'car',walk:'walk',bus:'bus',train:'train',car:'car'}[String(a).trim()]||'walk';startDrawing(m)}
function renderItems(){let a=currentRoute?.items||[];E.items.innerHTML=a.length?a.map((i,n)=>{if(i.type==='pin'){let p=pins.find(x=>x.id===i.pinId);return `<div class="item" draggable="true" data-i="${n}"><span class="drag-handle">≡</span><div class="grow"><b>${n+1}. 📍 ${esc(p?.name||'ピン')}</b></div><button data-edit="${i.pinId}">✏️</button><button data-remove="${n}">×</button></div>`}let m=MODE[i.mode]||MODE.walk;return `<div class="item" draggable="true" data-i="${n}"><span class="drag-handle">≡</span><div class="grow"><b>${n+1}. ${m.icon} ${m.label}</b><div class="muted">道筋</div></div><button data-mode="${n}">変更</button><button data-remove="${n}">×</button></div>`}).join(''):'<div class="empty">まだ行程がありません。</div>';E.items.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{currentRoute.items.splice(+b.dataset.remove,1);renderItems();renderLines()});E.items.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));E.items.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{let n=+b.dataset.mode,a=prompt('交通手段：1徒歩 2バス 3電車 4車',String({walk:1,bus:2,train:3,car:4}[currentRoute.items[n].mode]||1));let m={1:'walk',2:'bus',3:'train',4:'car'}[a];if(m)currentRoute.items[n].mode=m;renderItems();renderLines()});let di=null;E.items.querySelectorAll('.item').forEach(el=>{el.ondragstart=()=>di=+el.dataset.i;el.ondragover=e=>e.preventDefault();el.ondrop=()=>{let to=+el.dataset.i;if(di==null||di===to)return;let x=currentRoute.items.splice(di,1)[0];currentRoute.items.splice(to,0,x);di=null;renderItems();renderLines()}})}
E.undoItem.onclick=()=>{if(currentRoute?.items.length){currentRoute.items.pop();renderItems();renderLines()}};
function resizeCanvas(){let d=devicePixelRatio||1;E.canvas.width=innerWidth*d;E.canvas.height=innerHeight*d;E.canvas.style.width=innerWidth+'px';E.canvas.style.height=innerHeight+'px';E.canvas.getContext('2d').setTransform(d,0,0,d,0,0)}
function ll(x,y){let p=map.unproject([x,y]);return[p.lng,p.lat]}
function redraw(){let c=E.canvas.getContext('2d');c.clearRect(0,0,innerWidth,innerHeight);if(drawPoints.length<2)return;let m=MODE[E.canvas.dataset.mode]||MODE.walk;c.strokeStyle=m.color;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();drawPoints.forEach((p,i)=>{let s=map.project({lng:p[0],lat:p[1]});i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y)});c.stroke()}
function startDrawing(mode){
  // Start/resume the SAME path-building session. Never clear drawStrokes here.
  drawing=true;
  E.canvas.dataset.mode=mode;
  E.canvas.classList.add('show');
  E.banner.classList.add('show');
  E.drawToggle.textContent='⏸ 描画OFF';
  E.drawText.textContent=`${MODE[mode].icon} ${MODE[mode].label}：描画ON`;
  // In ON mode, one-finger drawing is active and map panning is disabled.
  map.dragPan.disable();
  map.touchZoomRotate.enable();
  resizeCanvas();
  redraw();
}

function pauseDrawing(){
  if(!drawing)return;
  // Keep every completed segment. Save an in-progress segment before pausing.
  if(drawPoints.length>2){
    drawStrokes.push(drawPoints.slice());
    drawPoints=[];
  }else{
    drawPoints=[];
  }
  drawing=false;
  E.canvas.classList.remove('show');
  // IMPORTANT: keep the banner visible so ON/OFF, undo, and 完了 remain available.
  E.banner.classList.add('show');
  E.drawToggle.textContent='▶ 描画ON';
  E.drawText.textContent=`${MODE[E.canvas.dataset.mode||'walk'].icon} ${MODE[E.canvas.dataset.mode||'walk'].label}：描画OFF（地図を移動できます）`;
  map.dragPan.enable();
  map.touchZoomRotate.enable();
  redraw();
}

function stopDrawing(){
  drawing=false;
  drawPoints=[];
  drawStrokes=[];
  E.canvas.classList.remove('show');
  E.banner.classList.remove('show');
  E.canvas.getContext('2d').clearRect(0,0,innerWidth,innerHeight);
  if(map){
    map.dragPan.enable();
    map.touchZoomRotate.enable();
  }
}

function finishDrawing(){
  if(!currentRoute)return;
  // Save the last active segment, then commit ALL segments as one drawing action.
  if(drawPoints.length>2){
    drawStrokes.push(drawPoints.slice());
    drawPoints=[];
  }

  const mode=E.canvas.dataset.mode||'walk';
  for(const points of drawStrokes){
    if(points.length>2){
      currentRoute.items.push({id:uid(),type:'path',mode,points});
    }
  }

  if(drawStrokes.length){
    renderItems();
    renderLines();
    E.routeCurrent.textContent=`${MODE[mode].icon} ${MODE[mode].label} の道筋を追加しました。`;
  }

  drawStrokes=[];
  stopDrawing();
  adding=false;
  E.route.classList.remove('route-adding');
  if(currentRoute)E.routePanel.classList.add('show');
}

function redraw(){
  let c=E.canvas.getContext('2d');c.clearRect(0,0,innerWidth,innerHeight);
  let m=MODE[E.canvas.dataset.mode]||MODE.walk;
  const one=points=>{
    if(points.length<2)return;
    c.strokeStyle=m.color;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();
    points.forEach((p,i)=>{let s=map.project({lng:p[0],lat:p[1]});i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y)});c.stroke();
  };
  drawStrokes.forEach(one); one(drawPoints);
}
let mouse=false;
E.canvas.addEventListener('touchstart',e=>{
  if(!drawing || e.touches.length!==1)return;
  e.preventDefault(); let t=e.touches[0]; drawPoints=[ll(t.clientX,t.clientY)]; redraw();
},{passive:false});
E.canvas.addEventListener('touchmove',e=>{
  if(!drawing || e.touches.length!==1)return;
  e.preventDefault(); let t=e.touches[0]; drawPoints.push(ll(t.clientX,t.clientY)); redraw();
},{passive:false});
E.canvas.addEventListener('touchend',e=>{
  if(!drawing)return;
  e.preventDefault();
  if(drawPoints.length>2){drawStrokes.push(drawPoints.slice());drawPoints=[];redraw();}
},{passive:false});
E.canvas.onmousedown=e=>{if(!drawing)return;mouse=true;drawPoints=[ll(e.clientX,e.clientY)];redraw()};
E.canvas.onmousemove=e=>{if(drawing&&mouse){drawPoints.push(ll(e.clientX,e.clientY));redraw()}};
E.canvas.onmouseup=()=>{if(mouse&&drawPoints.length>2){drawStrokes.push(drawPoints.slice());drawPoints=[];redraw()}mouse=false};
E.canvas.onmouseleave=()=>{if(mouse&&drawPoints.length>2){drawStrokes.push(drawPoints.slice());drawPoints=[];redraw()}mouse=false};
addEventListener('resize',()=>drawing&&(resizeCanvas(),redraw()));

E.drawToggle.onclick=()=>{
  if(drawing){
    pauseDrawing();
  }else{
    startDrawing(E.canvas.dataset.mode||'walk');
  }
};

// 「一つ戻す」：最後に確定した道筋（ストローク）を1本だけ取り消す。
// まだ確定していない描画中の線があれば、そちらを先に取り消す。
E.undoPoint.onclick=()=>{
  if(!currentRoute)return;

  if(drawPoints.length){
    drawPoints=[];
    redraw();
    return;
  }

  if(drawStrokes.length){
    drawStrokes.pop();
    redraw();
  }
};

// 「完了」：現在の描画セッションを旅行ルートへ確定する。
E.finishDraw.onclick=()=>{
  if(!currentRoute)return;
  finishDrawing();
};

// 「取消」：今回の道筋追加だけを破棄し、旅行ルート編集画面へ戻る。
// 既に保存済みのルートや、今回より前に追加した行程は変更しない。
E.cancelDraw.onclick=()=>{
  if(!currentRoute)return;
  stopDrawing();
  adding=false;
  E.route.classList.remove('route-adding');
  E.routePanel.classList.add('show');
  E.routeCurrent.textContent='道筋の追加を取り消しました。';
};

E.saveRoute.onclick=async()=>{if(!currentRoute)return;currentRoute.name=E.routeName.value.trim()||'名称未設定の旅行';await put('routes',currentRoute);routes=await all('routes');stopDrawing();routeMode=false;currentRoute=null;adding=false;E.route.classList.remove('route-adding');closePanels();renderLines();alert('旅行ルートを保存しました。')};
E.view.onclick=async()=>{routes=await all('routes');E.list.innerHTML=routes.length?routes.map(r=>`<div class="item"><div class="grow"><b>📁 ${esc(r.name)}</b><div class="muted">${(r.items||[]).length}項目</div></div><button class="primary" data-open="${r.id}">見る</button><button class="danger" data-del="${r.id}">削除</button></div>`).join(''):'<div class="empty">まだ旅行ルートがありません。</div>';E.list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showRoute(b.dataset.open));E.list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('この旅行ルートを削除しますか？')){await remove('routes',b.dataset.del);routes=await all('routes');renderLines();E.view.classList.add('show');E.view.classList.remove('show');E.routes.classList.add('show');E.view.classList.remove('show')}});closePanels();E.routes.classList.add('show')};
E.closeRoutes.onclick=closePanels;
function showRoute(id){let r=routes.find(x=>x.id===id);if(!r)return;E.viewTitle.textContent=r.name;E.viewBody.innerHTML=(r.items||[]).map((i,n)=>i.type==='pin'?`<div class="item"><div class="grow"><b>${n+1}. 📍 ${esc(pins.find(p=>p.id===i.pinId)?.name||'ピン')}</b></div></div>`:`<div class="item"><div class="grow"><b>${n+1}. ${(MODE[i.mode]||MODE.walk).icon} ${(MODE[i.mode]||MODE.walk).label}</b></div></div>`).join('')||'<div class="empty">行程はありません。</div>';closePanels();E.viewPanel.classList.add('show')}
E.closeView.onclick=closePanels;

map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[135.76,35.01],zoom:5.2,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
map.on('load',async()=>{addRouteLayer();try{await openDB();pins=await all('pins');routes=await all('routes')}catch(e){}renderPins();renderLines()});
map.on('move',()=>drawing&&redraw());
map.on('click',e=>{if(pinPlacement&&!drawing)placementCoord=[e.lngLat.lng,e.lngLat.lat]});
})();
</script>
</body></html>
