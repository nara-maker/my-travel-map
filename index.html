<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>My Travel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#111}
    header{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:1000}
    h1{font-size:19px;margin:0}.topbtn{border:0;background:#eee;border-radius:10px;padding:8px 10px;font-size:13px}
    #map{height:calc(100vh - 58px);height:calc(100dvh - 58px);z-index:1}
    .panel{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0002;z-index:1100;max-height:70vh;overflow:auto;display:none}
    .panel.show{display:block}.panel h2{font-size:18px;margin:0 0 10px}.row{display:flex;gap:8px}.row>*{flex:1}
    input,textarea,button{font:inherit} input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:5px 0 9px;background:#fff}
    textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 12px;background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.btn.danger{background:#c62828}
    .thumbs{display:flex;gap:8px;overflow:auto;margin:5px 0 10px}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px}
    .route-mode{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:#111;color:#fff;padding:9px 14px;border-radius:20px;display:none}
    .route-mode.show{display:block}.leaflet-control-attribution{font-size:9px}
    .small{font-size:12px;color:#666}.list{display:flex;flex-direction:column;gap:8px}.item{padding:10px;background:#f5f5f7;border-radius:12px}
  </style>
</head>
<body>
<header><h1>🗺️ My Travel Map</h1><button class="topbtn" id="settingsBtn">設定</button></header>
<div id="map"></div>
<div id="routeMode" class="route-mode">ルート作成中：地図を順番にタップ　「完了」で保存</div>

<div id="placePanel" class="panel">
  <h2>📍 場所を登録</h2>
  <div class="small" id="coords"></div>
  <input id="placeName" placeholder="場所の名前（例：清水寺）">
  <input id="placeDate" type="date">
  <textarea id="placeNote" placeholder="思い出・メモ"></textarea>
  <input id="placePhotos" type="file" accept="image/*" multiple>
  <div class="thumbs" id="photoPreview"></div>
  <div class="row"><button class="btn secondary" id="cancelPlace">キャンセル</button><button class="btn" id="savePlace">保存</button></div>
</div>

<div id="detailPanel" class="panel">
  <h2 id="detailName"></h2><div class="small" id="detailDate"></div>
  <div class="thumbs" id="detailPhotos"></div><p id="detailNote"></p>
  <div class="row"><button class="btn secondary" id="closeDetail">閉じる</button><button class="btn danger" id="deletePlace">削除</button></div>
</div>

<div id="routePanel" class="panel">
  <h2>🛣️ ルートを保存</h2>
  <input id="routeName" placeholder="ルート名（例：京都旅行）">
  <div class="small" id="routeCount">0地点</div>
  <div class="row"><button class="btn secondary" id="cancelRoute">キャンセル</button><button class="btn" id="saveRoute">完了・保存</button></div>
</div>

<div id="settingsPanel" class="panel">
  <h2>⚙️ データ管理</h2>
  <p class="small">旅の場所・ルート・写真はこのiPhoneのIndexedDBに保存されます。バックアップは定期的に行ってください。</p>
  <div class="row"><button class="btn" id="exportBtn">バックアップ</button><button class="btn secondary" id="importBtn">復元</button></div>
  <input id="importFile" type="file" accept=".json" style="display:none">
  <button class="btn secondary" id="closeSettings" style="width:100%;margin-top:8px">閉じる</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DB_NAME="MyTravelMapDB", DB_VERSION=1;
let db, map, pendingLatLng=null, selectedPlaceId=null, pendingPhotos=[], routeMode=false, routePoints=[], routeLine=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("places")) d.createObjectStore("places",{keyPath:"id"});
      if(!d.objectStoreNames.contains("routes")) d.createObjectStore("routes",{keyPath:"id"});
    };
    req.onsuccess=e=>{db=e.target.result;resolve()};
    req.onerror=e=>reject(e);
  });
}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function put(store,obj){return new Promise((res,rej)=>{const r=tx(store,"readwrite").put(obj);r.onsuccess=()=>res();r.onerror=rej})}
function get(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function all(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})}
function del(store,id){return new Promise((res,rej)=>{const r=tx(store,"readwrite").delete(id);r.onsuccess=()=>res();r.onerror=rej})}

function closePanels(){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"))}
function show(id){closePanels();document.getElementById(id).classList.add("show")}

function initMap(){
  map=L.map("map").setView([35.0116,135.7681],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  map.on("click",e=>{
    if(routeMode){routePoints.push([e.latlng.lat,e.latlng.lng]);routeLine && map.removeLayer(routeLine);routeLine=L.polyline(routePoints).addTo(map);document.getElementById("routeCount").textContent=routePoints.length+"地点";return;}
    pendingLatLng=e.latlng;
    document.getElementById("coords").textContent=`緯度 ${e.latlng.lat.toFixed(5)} / 経度 ${e.latlng.lng.toFixed(5)}`;
    document.getElementById("placeDate").value=new Date().toISOString().slice(0,10);
    document.getElementById("placeName").value="";document.getElementById("placeNote").value="";
    pendingPhotos=[];document.getElementById("photoPreview").innerHTML="";
    show("placePanel");
  });
}

async function renderPlaces(){
  const places=await all("places");
  places.forEach(p=>{
    if(p._marker) return;
    const m=L.marker([p.lat,p.lng]).addTo(map).bindTooltip(p.name||"無題");
    m.on("click",()=>showDetail(p.id)); p._marker=m;
  });
  // Reload markers from scratch to reflect current data.
  map.eachLayer(l=>{if(l instanceof L.Marker) map.removeLayer(l)});
  places.forEach(p=>{
    const m=L.marker([p.lat,p.lng]).addTo(map).bindTooltip(p.name||"無題");
    m.on("click",()=>showDetail(p.id));
  });
  const routes=await all("routes");
  routes.forEach(r=>L.polyline(r.points).addTo(map));
}

async function showDetail(id){
  const p=await get("places",id); if(!p)return;
  selectedPlaceId=id;document.getElementById("detailName").textContent="📍 "+(p.name||"無題");
  document.getElementById("detailDate").textContent=p.date||"";
  document.getElementById("detailNote").textContent=p.note||"";
  const box=document.getElementById("detailPhotos");box.innerHTML="";
  (p.photos||[]).forEach(blob=>{const img=document.createElement("img");img.src=URL.createObjectURL(blob);box.appendChild(img)});
  show("detailPanel");
}

document.getElementById("placePhotos").onchange=e=>{
  pendingPhotos=[...e.target.files];
  const box=document.getElementById("photoPreview");box.innerHTML="";
  pendingPhotos.forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);box.appendChild(img)});
};
document.getElementById("savePlace").onclick=async()=>{
  if(!pendingLatLng)return;
  await put("places",{id:crypto.randomUUID(),lat:pendingLatLng.lat,lng:pendingLatLng.lng,name:document.getElementById("placeName").value.trim(),date:document.getElementById("placeDate").value,note:document.getElementById("placeNote").value,photos:pendingPhotos});
  closePanels();pendingLatLng=null;await renderPlaces();
};
document.getElementById("cancelPlace").onclick=closePanels;
document.getElementById("closeDetail").onclick=closePanels;
document.getElementById("deletePlace").onclick=async()=>{if(selectedPlaceId&&confirm("この場所を削除しますか？")){await del("places",selectedPlaceId);closePanels();await renderPlaces()}};

document.getElementById("settingsBtn").onclick=()=>show("settingsPanel");
document.getElementById("closeSettings").onclick=closePanels;

document.getElementById("cancelRoute").onclick=()=>{
  routeMode=false;routePoints=[];if(routeLine)map.removeLayer(routeLine);routeLine=null;
  document.getElementById("routeMode").classList.remove("show");closePanels();
};
document.getElementById("saveRoute").onclick=async()=>{
  if(routePoints.length<2){alert("2地点以上タップしてください");return}
  await put("routes",{id:crypto.randomUUID(),name:document.getElementById("routeName").value.trim()||"無題のルート",points:routePoints});
  routeMode=false;routePoints=[];routeLine=null;document.getElementById("routeMode").classList.remove("show");closePanels();await renderPlaces();
};

document.getElementById("exportBtn").onclick=async()=>{
  const places=await all("places"),routes=await all("routes");
  // Blobs are converted to data URLs so the backup contains photos too.
  const photoToData=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
  const out={version:1,createdAt:new Date().toISOString(),places:[],routes};
  for(const p of places){const q={...p,photos:[]};for(const b of (p.photos||[]))q.photos.push(await photoToData(b));out.places.push(q)}
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MyTravelMap_backup.json";a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data.version)throw Error("invalid");
    for(const r of (data.routes||[]))await put("routes",r);
    for(const p of (data.places||[])){
      const photos=[];
      for(const s of (p.photos||[])){const res=await fetch(s);photos.push(await res.blob())}
      await put("places",{...p,photos});
    }
    alert("復元しました");location.reload();
  }catch(err){alert("バックアップファイルを読み込めませんでした")}
};

document.getElementById("settingsPanel").addEventListener("click",e=>e.stopPropagation());

(async()=>{await openDB();initMap();await renderPlaces()})();
</script>
</body>
</html>
