<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>My Travel Map</title><link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}#map{position:fixed;inset:0}.bar{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap}.bar button,button{border:0;border-radius:12px;padding:10px 12px;background:#fff;box-shadow:0 2px 9px #0003;font-weight:700}.primary{background:#1769e0;color:#fff}.panel{display:none;position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:16px;max-height:80vh;overflow:auto;box-shadow:0 -4px 18px #0003}.show{display:block}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.title{font-size:20px;font-weight:800;margin:0 0 10px}.space{height:8px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:80px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.item{display:flex;gap:8px;align-items:center;border:1px solid #eee;border-radius:12px;padding:9px;margin:6px 0;background:#fff}.item .main{flex:1}.muted{font-size:12px;color:#777}.icon{font-size:21px}.handle{font-size:20px;color:#888}.choice button{width:100%;margin:4px 0}.viewer{display:none;position:fixed;inset:0;z-index:50;background:#000d;align-items:center;justify-content:center}.viewer.show{display:flex}.viewer img{max-width:96%;max-height:90%;object-fit:contain}.viewer button{position:absolute;top:20px;right:15px}.help{display:none;position:fixed;z-index:6;top:105px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 10px;border-radius:10px;font-size:12px}.route .help{display:block}</style></head><body><div id="map"></div><div class="bar"><button id="pinBtn">＋ ピンを追加</button><button id="routeBtn" class="primary">🛣️ 旅行のルートを作成</button><button id="listBtn">🗺️ 旅行ルートを参照</button></div><div class="help">一本指：道筋を描く ／ 二本指：地図を移動・拡大縮小</div>
<div id="pinPanel" class="panel"><div class="row"><h2 id="pinHead" class="title">ピンを追加</h2><button onclick="hide('pinPanel')">閉じる</button></div><label>場所の名前</label><div class="space"></div><input id="pn"><div class="space"></div><label>メモ</label><div class="space"></div><textarea id="pm"></textarea><div class="space"></div><label>訪問日</label><div class="space"></div><input id="pd" type="date"><div class="space"></div><b>写真</b><div id="pg" class="photos"></div><div class="space"></div><input id="pi" type="file" accept="image/*" multiple><div class="space"></div><div class="row"><button onclick="hide('pinPanel')">キャンセル</button><button class="primary" id="savePin">保存</button></div></div>
<div id="detail" class="panel"><div class="row"><h2 id="dt" class="title"></h2><button onclick="hide('detail')">閉じる</button></div><div id="db"></div><div class="space"></div><div class="row"><button class="primary" id="edit">✏️ 編集</button><button id="delPin">削除</button></div></div>
<div id="routePanel" class="panel"><div class="row"><h2 class="title">旅行のルートを作成</h2><button onclick="closeRoute()">閉じる</button></div><label>旅行の名前</label><div class="space"></div><input id="rn" placeholder="例：2026年 京都旅行"><div class="space"></div><div class="row"><button class="primary" id="add">＋ 追加</button><button id="undo">↩ 一つ戻す</button><button id="finish">完了</button></div><div class="space"></div><div id="items"></div></div>
<div id="choice" class="panel choice"><div class="row"><h2 class="title">追加</h2><button onclick="hide('choice')">閉じる</button></div><button id="addRoutePin">📍 ピンを追加</button><button id="addPath">✏️ 道筋を描く</button></div>
<div id="routes" class="panel"><div class="row"><h2 class="title">旅行ルートを参照</h2><button onclick="hide('routes')">閉じる</button></div><div id="routeList"></div></div>
<div id="viewer" class="viewer"><button onclick="hide('viewer')">閉じる</button><img id="vi"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script>
const DB='MyTravelMapDB',V=2,colors={walk:'#22a06b',bus:'#1677ff',train:'#d1242f',car:'#f59e0b'},labels={walk:'徒歩',bus:'バス',train:'電車',car:'車'},icons={walk:'🚶',bus:'🚌',train:'🚃',car:'🚗'};let db,pins=[],routes=[],map,route=null,draw=false,pts=[],pinPick=false,editId=null,currentId=null;
const uid=()=>crypto.randomUUID(),hide=id=>document.getElementById(id).classList.remove('show'),show=id=>document.getElementById(id).classList.add('show');
function dbopen(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,V);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('pins'))d.createObjectStore('pins',{keyPath:'id'});if(!d.objectStoreNames.contains('routes'))d.createObjectStore('routes',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(s,o){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function del(s,id){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function read(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
function initMap(){map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[135.76,35.01],zoom:5.2});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('load',()=>{map.addSource('routes',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'routes-line',type:'line',source:'routes',paint:{'line-color':['get','color'],'line-width':4}});render()})}
function render(){pins.forEach(p=>marker(p));let fs=[];routes.forEach(r=>r.items.forEach(i=>{if(i.type==='path'&&i.points.length>1)fs.push({type:'Feature',properties:{color:colors[i.mode]},geometry:{type:'LineString',coordinates:i.points}})}));if(map.getSource('routes'))map.getSource('routes').setData({type:'FeatureCollection',features:fs})}
function marker(p){if(p.m)p.m.remove();let e=document.createElement('div');e.style.cssText='width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#d1242f;border:3px solid #fff;box-shadow:0 2px 7px #0005';e.innerHTML='<span style="display:block;transform:rotate(45deg);color:#fff;text-align:center;line-height:24px">•</span>';e.onclick=x=>{x.stopPropagation();detail(p.id)};p.m=new maplibregl.Marker({element:e}).setLngLat(p.coord).addTo(map)}
function editor(id,coord){editId=id;currentId=id;let p=id?pins.find(x=>x.id===id):null;document.getElementById('pinHead').textContent=id?'ピンを編集':'ピンを追加';pn.value=p?.name||'';pm.value=p?.memo||'';pd.value=p?.date||'';pg.innerHTML=(p?.photos||[]).map((s,i)=>`<img src="${s}" onclick="viewImg('${s}')" title="写真">`).join('');show('pinPanel');if(!p)currentId=coord||map.getCenter().toArray()}
savePin.onclick=async()=>{let p=editId?pins.find(x=>x.id===editId):null;if(!p){p={id:uid(),coord:Array.isArray(currentId)?currentId:map.getCenter().toArray(),photos:[]};pins.push(p)}p.name=pn.value.trim()||'名称未設定';p.memo=pm.value;p.date=pd.value;for(let f of pi.files)p.photos.push(await read(f));await put('pins',p);marker(p);hide('pinPanel');editId=null};
function detail(id){let p=pins.find(x=>x.id===id);if(!p)return;currentId=id;dt.textContent=p.name;db.innerHTML=`<div class="muted">${p.date||''}</div><p>${esc(p.memo)}</p><div class="photos">${(p.photos||[]).map(s=>`<img src="${s}" onclick="viewImg('${s}')">`).join('')}</div>`;show('detail')};edit.onclick=()=>{hide('detail');editor(currentId)};delPin.onclick=async()=>{if(confirm('このピンを削除しますか？')){await del('pins',currentId);let p=pins.find(x=>x.id===currentId);if(p?.m)p.m.remove();pins=pins.filter(x=>x.id!==currentId);hide('detail')}};pinBtn.onclick=()=>editor(null,map.getCenter().toArray());
routeBtn.onclick=()=>{route={id:uid(),name:'',items:[]};document.body.classList.add('route');show('routePanel');renderItems()};add.onclick=()=>show('choice');addRoutePin.onclick=()=>{hide('choice');pinPick=true;alert('地図上の追加したい場所をタップしてください')};addPath.onclick=()=>{hide('choice');let m=prompt('交通手段：walk=徒歩 / bus=バス / train=電車 / car=車','walk')||'walk';route.drawMode=labels[m]?m:'walk';draw=true;pts=[];map.dragPan.disable();map.scrollZoom.disable();map.doubleClickZoom.disable()};
mapPick=()=>{};
map?.on;
function finishPath(){if(pts.length>2)route.items.push({id:uid(),type:'path',mode:route.drawMode,points:pts.slice()});draw=false;pts=[];map.dragPan.enable();map.scrollZoom.enable();map.doubleClickZoom.enable();renderItems();render()}
function renderItems(){items.innerHTML=route.items.length?route.items.map((i,n)=>i.type==='pin'?`<div class="item" draggable="true" data-i="${n}"><span class="handle">≡</span><span class="icon">📍</span><div class="main"><b>${esc((pins.find(p=>p.id===i.pinId)||{}).name||'ピン')}</b></div><button onclick="editor('${i.pinId}')">✏️</button><button onclick="route.items.splice(${n},1);renderItems();render()">×</button></div>`:`<div class="item" draggable="true" data-i="${n}"><span class="handle">≡</span><span class="icon">${icons[i.mode]}</span><div class="main"><b>${labels[i.mode]}</b><div class="muted">道筋</div></div><button onclick="changeMode(${n})">変更</button><button onclick="route.items.splice(${n},1);renderItems();render()">×</button></div>`).join(''):'<div class="muted">「＋ 追加」からピンまたは道筋を追加してください。</div>';let drag;document.querySelectorAll('#items .item').forEach(e=>{e.ondragstart=()=>drag=+e.dataset.i;e.ondragover=x=>x.preventDefault();e.ondrop=()=>{let to=+e.dataset.i;if(drag!==to){let a=route.items.splice(drag,1)[0];route.items.splice(to,0,a);renderItems()}}})}function changeMode(n){let m=prompt('交通手段：walk / bus / train / car',route.items[n].mode);if(labels[m]){route.items[n].mode=m;renderItems();render()}}
undo.onclick=()=>{for(let i=route.items.length-1;i>=0;i--)if(route.items[i].type==='path'){route.items.splice(i,1);renderItems();render();break}};finish.onclick=async()=>{route.name=rn.value.trim()||'名称未設定の旅行';await put('routes',route);routes=await all('routes');render();closeRoute();alert('保存しました。通常の地図にも表示されています。')};function closeRoute(){draw=false;document.body.classList.remove('route');map.dragPan.enable();map.scrollZoom.enable();hide('routePanel')}
map.on('click',e=>{if(pinPick&&route){pinPick=false;let p={id:uid(),name:'名称未設定',memo:'',date:'',photos:[],coord:[e.lngLat.lng,e.lngLat.lat]};pins.push(p);put('pins',p);marker(p);route.items.push({id:uid(),type:'pin',pinId:p.id});renderItems();return}if(draw)return});map.on('mousedown',e=>{if(draw){pts=[[e.lngLat.lng,e.lngLat.lat]]}});map.on('mousemove',e=>{if(draw&&pts.length){pts.push([e.lngLat.lng,e.lngLat.lat])}});map.on('mouseup',()=>{if(draw)finishPath()});map.on('touchstart',e=>{if(draw&&e.originalEvent.touches.length>=2){draw=false;map.dragPan.enable();map.scrollZoom.enable();return}if(draw&&e.originalEvent.touches.length===1)pts=[[e.lngLat.lng,e.lngLat.lat]]});map.on('touchmove',e=>{if(draw&&e.originalEvent.touches.length===1)pts.push([e.lngLat.lng,e.lngLat.lat])});map.on('touchend',()=>{if(draw)finishPath()});
listBtn.onclick=async()=>{routes=await all('routes');routeList.innerHTML=routes.length?routes.map(r=>`<div class="item"><span class="icon">📁</span><div class="main"><b>${esc(r.name)}</b><div class="muted">${r.items.length}項目</div></div><button class="primary" onclick="viewRoute('${r.id}')">見る</button><button onclick="removeRoute('${r.id}')">削除</button></div>`).join(''):'<div class="muted">まだ旅行ルートがありません。</div>';show('routes')};async function removeRoute(id){if(confirm('この旅行ルートを削除しますか？')){await del('routes',id);routes=await all('routes');render();listBtn.click()}}function viewRoute(id){let r=routes.find(x=>x.id===id);hide('routes');routeView(r)}function routeView(r){let text=r.items.map((i,n)=>i.type==='pin'?`<div class="item"><span class="icon">📍</span><div class="main"><b>${n+1}. ${esc((pins.find(p=>p.id===i.pinId)||{}).name||'ピン')}</b></div></div>`:`<div class="item"><span class="icon">${icons[i.mode]}</span><div class="main"><b>${n+1}. ${labels[i.mode]}</b></div></div>`).join('');alert(r.name+'\n\n'+r.items.map((i,n)=>`${n+1}. ${i.type==='pin'?(pins.find(p=>p.id===i.pinId)||{}).name||'ピン':labels[i.mode]}`).join('\n'));let coords=r.items.filter(i=>i.type==='pin').map(i=>(pins.find(p=>p.id===i.pinId)||{}).coord).filter(Boolean);if(coords.length)map.fitBounds(coords.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(coords[0],coords[0])),{padding:80,maxZoom:14})}
function viewImg(s){vi.src=s;show('viewer')}
dbopen().then(async()=>{pins=await all('pins');routes=await all('routes');initMap()});
</script></body></html>
